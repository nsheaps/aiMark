name: Deploy

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: deploy-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site + API
        run: mise run build

      # PRs get an ephemeral preview; main deploys to production.
      # Requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets
      # (see docs/specs/draft/aimark-platform.md "Manual setup required").
      - name: Deploy preview (PR)
        if: github.event_name == 'pull_request'
        id: preview
        working-directory: services/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler versions upload --tag "pr-${{ github.event.number }}" | tee upload.log
          URL=$(grep -oE 'https://[a-z0-9-]+\.aimark[a-z0-9-]*\.workers\.dev' upload.log | head -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            🚀 Preview deployed: ${{ steps.preview.outputs.url }}

      - name: Deploy production (main)
        if: github.ref == 'refs/heads/main'
        working-directory: services/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
