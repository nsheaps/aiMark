name: Release Web

# Cuts `web-v*` tags + CHANGELOG via release-it (conventional commits).
# Manual trigger keeps web release cadence deliberate; deploys themselves
# are continuous on main via deploy.yaml.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and authenticate as GitHub App
        id: auth
        uses: nsheaps/github-actions/.github/actions/checkout-as-app@603052841cd49b9fdc99bc32979ff9c45c9b669e # checkout-as-app@main
        with:
          app-id: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}
          ref: main

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: release-it
        env:
          GITHUB_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          git config user.name "${{ steps.auth.outputs.user-name }}"
          git config user.email "${{ steps.auth.outputs.user-email }}"
          bunx release-it --ci
